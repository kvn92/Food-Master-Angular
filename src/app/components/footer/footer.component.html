<footer class="footer text-white pt-4">
    <div class="container">
        <div class="row text-center text-md-start align-items-center">
            
            <!-- Logo -->
            <div class="col-md-3 mb-3">
                <a href="/">
                    <img [src]="logoUrl()" alt="Logo" class="img-fluid" style="max-width: 150px;" />
                </a>
            </div>

            <!-- Liens -->
            <div class="col-md-6 mb-3 text-center">
                <ul class="list-inline mb-0">
                    @for (lien of liens(); track lien) {
                        <li class="list-inline-item">
                            <a [href]="lien.url" class="text-white text-decoration-none">{{ lien.texte }}</a>
                        </li>
                    }
                </ul>
            </div>

            <!-- Réseaux sociaux -->
            <div class="col-md-3 mb-3">
                <div class="d-flex justify-content-center justify-content-md-end gap-3">
                    @for (reseau of reseaux(); track reseau) {
                        <a [href]="reseau.url" class="text-white fs-4">
                            <i [class]="reseau.icon"></i>
                        </a>
                    }
                </div>
            </div>
        </div>

        <!-- Copyright -->
        <div class="row mt-3">
            <div class="col text-center">
                <p class="mb-0">© {{ annee() }} Food Master. Tous droits réservés.</p>
            </div>
        </div>
    </div>
</footer>
